name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
      - name: Verify release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          cmake_version="$(sed -nE 's/^project\(netft VERSION ([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' CMakeLists.txt)"
          if [[ "$version" != "$cmake_version" ]]; then
            echo "tag version $version does not match CMake version $cmake_version" >&2
            exit 1
          fi
          escaped_version="${version//./\\.}"
          if ! grep -Eq "^## ${escaped_version} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated release heading for $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and test release
        run: |
          pixi run cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=ON
          pixi run cmake --build build/release
          pixi run ctest --test-dir build/release --output-on-failure
          pixi run install-test
      - name: Create source archive and release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="netft-cpp-${VERSION}.tar.gz"
          git archive --format=tar.gz --prefix="netft-cpp-${VERSION}/" \
            --output="dist/${archive}" "$GITHUB_SHA"
          (cd dist && sha256sum "${archive}" > "${archive}.sha256")
          awk -v version="$VERSION" '
            index($0, "## " version " - ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/release-notes.md
          if [[ ! -s dist/release-notes.md ]]; then
            echo "release notes are empty" >&2
            exit 1
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash .github/scripts/publish_release.sh \
            "$GITHUB_REF_NAME" \
            "$VERSION" \
            "dist/netft-cpp-${VERSION}.tar.gz" \
            "dist/netft-cpp-${VERSION}.tar.gz.sha256" \
            dist/release-notes.md
