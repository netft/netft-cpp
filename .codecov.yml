coverage:
  range: "85...100"
  round: down
  precision: 2
  status:
    project:
      default:
        target: 85%
        threshold: 0%
        informational: true
    patch:
      default:
        target: 90%
        threshold: 0%
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
